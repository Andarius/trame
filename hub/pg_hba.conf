# Trame hub pg_hba — mounted read-only, activated via -c hba_file=... (replaces initdb's default).
# Unix socket inside the container: healthcheck, docker exec, and the entrypoint's initdb psql.
local   all   all                  trust
# Laptops: TLS required, CA-verified client cert (CN = laptop node-id) AND scram password.
hostssl all   tracker   0.0.0.0/0  scram-sha-256   clientcert=verify-ca
# Everything else — including any non-TLS TCP attempt — is rejected.
host    all   all       all        reject
