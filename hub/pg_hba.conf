# Trame hub pg_hba — mounted read-only, activated via -c hba_file=... (replaces initdb's default).
# Unix socket inside the container: healthcheck, docker exec, and the entrypoint's initdb psql.
local   all   all                  trust
# tracker-api: same-host docker network only (fixed subnet in compose, not port-mapped).
# Laptops no longer reach Postgres at all — they sync through the API (the port
# mapping is gone from compose; the old mTLS hostssl rule went with it).
host    all   tracker   172.28.94.0/24  scram-sha-256
# Everything else — including any non-TLS TCP attempt — is rejected.
host    all   all       all        reject
