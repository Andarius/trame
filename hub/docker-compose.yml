# Runs on the hub machine. Postgres = the sync hub / source of truth.
# Deployed to ~/Apps/tracker on the hub machine by hub/deploy.sh; also runs locally (just db).
services:
  tracker-db:
    image: postgres:18   # >=18: uuidv7() used by the udb_* tables; matches PGlite 0.5.x (PG 18)
    container_name: tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: tracker
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # mTLS: gen-certs.sh must have populated ./certs before first start (deploy.sh / `just db` do).
    command:
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/tracker-tls/server.crt
      - -c
      - ssl_key_file=/etc/tracker-tls/server.key
      - -c
      - ssl_ca_file=/etc/tracker-tls/ca.crt
      - -c
      - hba_file=/etc/tracker-hba.conf
    # No host port: laptops sync through tracker-api (the auth boundary); Postgres is
    # reachable only on the docker network. Legacy direct-PG topology: add back
    #   ports: ["${TRACKER_BIND:-127.0.0.1}:${TRACKER_PORT:-5433}:5432"]
    volumes:
      # postgres:18 moved PGDATA to a version subdir — mount the parent, not .../data
      - tracker-db-data:/var/lib/postgresql
      # Schema is applied once on first boot of an empty data dir.
      # TRACKER_SCHEMA: deploy.sh sets ./schema.sql (flat dir on the hub); default = repo layout.
      - ${TRACKER_SCHEMA:-../db/schema.sql}:/docker-entrypoint-initdb.d/10-schema.sql:ro
      # TLS material (gen-certs.sh) + hba. Relative to this file's dir: works in-repo and deployed.
      # hba lives outside /etc/tracker-tls — a file can't be mounted inside an ro mount.
      - ./certs:/etc/tracker-tls:ro
      - ./pg_hba.conf:/etc/tracker-hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d tracker"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Hub API (phase 3 of docs/hub-api.md): the auth boundary in front of Postgres.
  # Deno terminates TLS itself with the same gen-certs material as the db. DB access
  # is docker-network-only; pg_hba scopes a scram rule to the fixed subnet below.
  tracker-api:
    image: denoland/deno:alpine
    container_name: tracker-api
    restart: unless-stopped
    depends_on:
      tracker-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://tracker:${POSTGRES_PASSWORD}@tracker-db:5432/tracker
      DENO_DIR: /deno-cache
    # --frozen: the mount is read-only — validate the shipped lockfile, never write it
    command: ["run", "-A", "--frozen", "--config", "/srv/hub/api/deno.json", "/srv/hub/api/main.ts"]
    volumes:
      # TRACKER_API_SRC/TRACKER_PROTOCOL_SRC: deploy.sh layout is flat; default = repo layout.
      # Mount paths preserve the api → ../../protocol relative import.
      - ${TRACKER_API_SRC:-./api}:/srv/hub/api:ro
      - ${TRACKER_PROTOCOL_SRC:-../protocol}:/srv/protocol:ro
      - ./certs:/certs:ro
      - tracker-deno-cache:/deno-cache
    ports:
      - "${TRACKER_BIND:-127.0.0.1}:${TRACKER_API_PORT:-8443}:8443"

networks:
  # Fixed subnet so the pg_hba rule for tracker-api can be scoped tightly.
  default:
    ipam:
      config:
        - subnet: 172.28.94.0/24

volumes:
  tracker-db-data:
  tracker-deno-cache:
