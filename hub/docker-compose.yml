# Runs on the hub machine. Postgres = the sync hub / source of truth.
# Deployed to ~/Apps/tracker on the hub machine by hub/deploy.sh; also runs locally (just db).
services:
  tracker-db:
    image: postgres:18   # >=18: uuidv7() used by the udb_* tables; matches PGlite 0.5.x (PG 18)
    container_name: tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: tracker
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # mTLS: gen-certs.sh must have populated ./certs before first start (deploy.sh / `just db` do).
    command:
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/tracker-tls/server.crt
      - -c
      - ssl_key_file=/etc/tracker-tls/server.key
      - -c
      - ssl_ca_file=/etc/tracker-tls/ca.crt
      - -c
      - hba_file=/etc/tracker-hba.conf
    ports:
      # TRACKER_BIND: the hub's LAN IP (set in .env by deploy.sh). Never 0.0.0.0.
      - "${TRACKER_BIND:-127.0.0.1}:${TRACKER_PORT:-5433}:5432"
    volumes:
      # postgres:18 moved PGDATA to a version subdir — mount the parent, not .../data
      - tracker-db-data:/var/lib/postgresql
      # Schema is applied once on first boot of an empty data dir.
      # TRACKER_SCHEMA: deploy.sh sets ./schema.sql (flat dir on the hub); default = repo layout.
      - ${TRACKER_SCHEMA:-../db/schema.sql}:/docker-entrypoint-initdb.d/10-schema.sql:ro
      # TLS material (gen-certs.sh) + hba. Relative to this file's dir: works in-repo and deployed.
      # hba lives outside /etc/tracker-tls — a file can't be mounted inside an ro mount.
      - ./certs:/etc/tracker-tls:ro
      - ./pg_hba.conf:/etc/tracker-hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d tracker"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  tracker-db-data:
