# A minimal WebAssembly plugin: the integration tests' fixture and a template to copy.
# Build: `just wasm-fixture` (scripts/wasm-fixture.sh).
[package]
name = "trame-wasm-hello"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"
wit-bindgen = "0.63"

[profile.release]
opt-level = "s"
strip = true
lto = true

# its own workspace, not a member of Trame's
[workspace]
