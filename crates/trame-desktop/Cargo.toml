[package]
name = "trame-desktop"
version = "0.30.0"
edition.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
anyhow = "1.0.104"
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = [] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "signal", "sync", "time"] }
trame-local = { path = "../trame-local" }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.191"

[lints]
workspace = true
