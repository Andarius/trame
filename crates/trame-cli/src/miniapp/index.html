<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Due</title>
<script src="https://telegram.org/js/telegram-web-app.js?65"></script>
<style>
  /* Telegram theme, with TelegramUI's light defaults outside Telegram */
  :root {
    --bg: var(--tg-theme-bg-color, #fff);
    --text: var(--tg-theme-text-color, #000);
    --hint: var(--tg-theme-hint-color, #707579);
    --link: var(--tg-theme-link-color, #007aff);
    --button: var(--tg-theme-button-color, #007aff);
    --button-text: var(--tg-theme-button-text-color, #fff);
    --page: var(--tg-theme-secondary-bg-color, #efeff4);
    --section: var(--tg-theme-section-bg-color, #fff);
    --section-header: var(--tg-theme-section-header-text-color, #707579);
    --subtitle: var(--tg-theme-subtitle-text-color, #707579);
    --separator: var(--tg-theme-section-separator-color, rgba(127, 127, 127, .3));
    --red: var(--tg-theme-destructive-text-color, #e53935);
    --orange: #f5a623;
    --track: rgba(127, 127, 127, .18);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--text);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Roboto", "Helvetica Neue", sans-serif;
    padding: max(8px, env(safe-area-inset-top)) 0 max(20px, env(safe-area-inset-bottom));
    -webkit-tap-highlight-color: transparent;
  }
  .sec { margin: 0 16px 12px; border-radius: 12px; background: var(--section); overflow: hidden; }
  .tile { padding: 14px 16px; cursor: pointer; }
  .tile:active, .cell.tap:active { background: var(--track); }
  .row { display: flex; align-items: center; gap: 12px; }
  .grow { flex: 1; min-width: 0; }
  .t { font-size: 17px; line-height: 22px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .t.b { font-weight: 600; }
  .st { font-size: 15px; line-height: 20px; color: var(--subtitle); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cap { font-size: 13px; line-height: 16px; color: var(--hint); }
  .chev { color: var(--hint); font-size: 20px; }
  .bar { height: 6px; border-radius: 3px; background: var(--track); margin: 12px 0 10px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--red); }
  .av { width: 40px; height: 40px; border-radius: 50%; flex: none; overflow: hidden; display: flex;
        align-items: center; justify-content: center; color: #fff; font-weight: 600; font-size: 16px; }
  .av.big { width: 56px; height: 56px; font-size: 22px; }
  .av img { width: 100%; height: 100%; object-fit: cover; }
  .head { padding: 8px 16px 16px; }
  .title { font-size: 22px; line-height: 28px; font-weight: 700; }
  .sh { padding: 4px 32px 8px; font-size: 13px; line-height: 16px; text-transform: uppercase; color: var(--section-header); }
  .cell { display: flex; align-items: center; gap: 12px; padding: 0 16px; }
  .cell .mid { flex: 1; min-width: 0; padding: 11px 0; }
  .cell + .cell .mid { border-top: .5px solid var(--separator); }
  .wrap { white-space: normal; overflow-wrap: anywhere; font-size: 16px; line-height: 22px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; color: #fff; font-size: 13px;
           font-weight: 600; display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .red { color: var(--red); } .orange { color: var(--orange); } .blue { color: var(--link); }
  .bg-red { background: var(--red); } .bg-orange { background: var(--orange); } .bg-blue { background: var(--button); }
  .msg { color: var(--hint); text-align: center; margin: 48px 24px; font-size: 15px; }
  .msg.error { color: var(--red); }
  .topbar { display: flex; align-items: center; padding: 4px 16px 12px; }
  .topbar .title { flex: 1; }
  .icon-btn { font-size: 22px; line-height: 1; padding: 6px; color: var(--link); background: none; border: 0; cursor: pointer; }
  .field { display: flex; align-items: center; gap: 12px; padding: 0 16px; min-height: 44px; }
  .field + .field { border-top: .5px solid var(--separator); }
  .field label { flex: 1; font-size: 17px; }
  .field input, .field select { font: inherit; font-size: 17px; color: var(--link); background: none; border: 0; text-align: right; min-width: 0; }
  .field input[type=text] { color: var(--text); text-align: left; flex: 2; }
  .days { display: flex; gap: 6px; padding: 10px 16px; flex-wrap: wrap; }
  .day { padding: 6px 10px; border-radius: 14px; font-size: 15px; border: 1px solid var(--separator); color: var(--text); background: none; cursor: pointer; }
  .day.on { background: var(--button); border-color: var(--button); color: var(--button-text); }
  .link { color: var(--link); } .danger { color: var(--red); }
  .note { padding: 8px 32px 0; font-size: 13px; color: var(--hint); }
  .err { margin: 8px 16px; color: var(--red); font-size: 15px; }
  .fallback-save { display: block; margin: 16px; width: calc(100% - 32px); height: 50px; border-radius: 12px; border: 0;
                   background: var(--button); color: var(--button-text); font: inherit; font-weight: 600; font-size: 16px; }
</style>
</head>
<body>
<div id="root"><div class="msg">Loading…</div></div>
<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  var root = document.getElementById('root');
  var PARKED = ['paused', 'blocked', 'done'];
  var data = { rows: [], icons: {} };
  var stack = [];

  if (tg) {
    tg.ready();
    tg.expand();
    try { tg.setHeaderColor('secondary_bg_color'); tg.setBackgroundColor('secondary_bg_color'); } catch (e) {}
    tg.BackButton.onClick(back);
  }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function add(parent) { for (var i = 1; i < arguments.length; i++) if (arguments[i]) parent.appendChild(arguments[i]); return parent; }
  function plain(s) { return String(s || '').replace(/\[([^\]]+)\]\([^)]+\)/g, '$1').replace(/`/g, ''); }
  function late(d) { return d < 0 ? (-d) + 'd late' : d === 0 ? 'today' : 'in ' + d + 'd'; }
  function sev(d) { return d <= -3 ? 'red' : d < 0 ? 'orange' : 'blue'; }
  function hue(s) { var h = 7; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360; return h; }
  function tap() { if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light'); }

  function avatar(project, big) {
    var a = el('div', 'av' + (big ? ' big' : ''));
    var icon = data.icons[project];
    if (typeof icon === 'string' && icon.indexOf('data:image/') === 0) {
      var img = el('img'); img.alt = ''; img.src = icon; a.appendChild(img);
    } else {
      a.style.background = 'hsl(' + hue(project) + ' 55% 55%)';
      a.textContent = project.charAt(0).toUpperCase();
    }
    return a;
  }
  function counts(todos) {
    var l = todos.filter(function (r) { return r.days < 0; }).length;
    var t = todos.filter(function (r) { return r.days === 0; }).length;
    var parts = [];
    if (l) parts.push(l + ' late');
    if (t) parts.push(t + ' today');
    if (!parts.length) parts.push(todos.length + ' coming up');
    return parts.join(' · ');
  }
  function group(list, key) {
    var out = [], idx = {};
    list.forEach(function (r) {
      var k = key(r);
      if (!(k in idx)) { idx[k] = out.length; out.push({ key: k, todos: [] }); }
      out[idx[k]].todos.push(r);
    });
    return out;
  }
  function cardsOf(project) {
    return group(data.rows.filter(function (r) { return r.project === project; }), function (r) { return r.card; })
      .map(function (c) { var f = c.todos[0]; return { title: c.key, todos: c.todos, status: f.status, worst: f.days, project: project }; });
  }
  function parked(c) { return PARKED.indexOf(c.status) >= 0; }

  function show(view) {
    root.textContent = '';
    root.appendChild(view);
    window.scrollTo(0, 0);
    if (tg) { if (stack.length) tg.BackButton.show(); else tg.BackButton.hide(); }
  }
  function go(render) { stack.push(render); show(render()); tap(); }
  function back() { mainButton(null); stack.pop(); show(stack.length ? stack[stack.length - 1]() : home()); }

  // 1 · project tiles
  function home() {
    var view = el('div');
    var gear = el('button', 'icon-btn', '⚙'); gear.type = 'button'; gear.setAttribute('aria-label', 'Schedules');
    gear.onclick = function () { go(schedulesView); };
    add(view, add(el('div', 'topbar'), el('div', 'title', 'Due'), gear));
    var projects = group(data.rows, function (r) { return r.project; });
    if (!projects.length) return add(view, el('div', 'msg', 'Nothing late or due this week.'));
    projects.forEach(function (p) {
      var todos = p.todos;
      var cards = cardsOf(p.key);
      var worst = cards.filter(function (c) { return !parked(c); })[0] || cards[0];
      var lateN = todos.filter(function (r) { return r.days < 0; }).length;
      var tile = el('div', 'sec tile');
      var head = add(el('div', 'row'), avatar(p.key),
        add(el('div', 'grow'), el('div', 't b', p.key), el('div', 'st', counts(todos))), el('span', 'chev', '›'));
      var bar = el('div', 'bar'); var fill = el('div'); fill.style.width = Math.round(100 * lateN / todos.length) + '%'; bar.appendChild(fill);
      var note = el('div', 'cap', 'Worst: ' + worst.title + ' · ');
      note.appendChild(el('span', sev(worst.worst), late(worst.worst)));
      add(tile, head, bar, note);
      tile.onclick = function () { go(function () { return project(p.key); }); };
      view.appendChild(tile);
    });
    return view;
  }

  // 2 · a project's cards
  function project(name) {
    var view = el('div');
    var all = data.rows.filter(function (r) { return r.project === name; });
    add(view, add(el('div', 'head row'), avatar(name, true),
      add(el('div', 'grow'), el('div', 'title', name), el('div', 'st', counts(all)))));
    var cards = cardsOf(name);
    [['Active', cards.filter(function (c) { return !parked(c); })], ['Paused or done', cards.filter(parked)]].forEach(function (s) {
      if (!s[1].length) return;
      view.appendChild(el('div', 'sh', s[0]));
      var sec = el('div', 'sec');
      s[1].forEach(function (c) {
        var title = c.title + (parked(c) ? ' · ' + c.status : '');
        var badge = el('span', 'badge bg-' + sev(c.worst), String(c.todos.length));
        var cell = add(el('div', 'cell tap'), add(el('span', 'dot bg-' + sev(c.worst))),
          add(el('div', 'mid'), el('div', 't', title), el('div', 'st', late(c.worst) + ' · ' + plain(c.todos[0].text))), badge);
        cell.onclick = function () { go(function () { return card(c); }); };
        sec.appendChild(cell);
      });
      view.appendChild(sec);
    });
    return view;
  }

  // 3 · a card's todos
  function card(c) {
    var view = el('div');
    add(view, add(el('div', 'head'), el('div', 'cap', c.project + (parked(c) ? ' · ' + c.status : '')), el('div', 'title', c.title)));
    view.appendChild(el('div', 'sh', c.todos.length + (c.todos.length > 1 ? ' todos' : ' todo')));
    var sec = el('div', 'sec');
    c.todos.forEach(function (r) {
      sec.appendChild(add(el('div', 'cell'), add(el('div', 'mid'), el('div', 'wrap', plain(r.text)), el('div', 'cap ' + sev(r.days), late(r.days) + ' · due ' + r.due))));
    });
    return add(view, sec);
  }


  // Schedules: read and saved through the signed API; validation is the server's
  var DAYS = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
  var WINDOWS = [['late', 'Late only'], ['today', 'Late + today'], ['week', 'Late + this week']];
  var settings = null;

  function api(path, body) {
    return fetch(path, {
      method: 'POST',
      headers: { 'X-Telegram-Init-Data': tg ? tg.initData : '', 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (json) {
        if (!res.ok) throw new Error(json.error || ('Request failed (' + res.status + ')'));
        return json;
      });
    });
  }
  function daysLabel(days) {
    if (days.length === 7) return 'Every day';
    if (days.join() === 'mon,tue,wed,thu,fri') return 'Mon–Fri';
    return days.map(function (d) { return d.charAt(0).toUpperCase() + d.slice(1); }).join(', ');
  }
  function windowLabel(w) {
    for (var i = 0; i < WINDOWS.length; i++) if (WINDOWS[i][0] === w) return WINDOWS[i][1];
    return 'Late + next ' + w + ' days';
  }
  function mainButton(text, onClick) {
    if (!tg) return null;
    var b = tg.MainButton;
    b.offClick(b._trameHandler || function () {});
    if (!text) { b.hide(); return b; }
    b._trameHandler = onClick;
    b.setText(text); b.onClick(onClick); b.show();
    return b;
  }

  function schedulesView() {
    var view = el('div');
    mainButton(null);
    if (!settings) {
      view.appendChild(el('div', 'msg', 'Loading…'));
      api('/tg/api/settings').then(function (s) { settings = s; show(schedulesView()); })
        .catch(function (e) { fail(e.message); });
      return view;
    }
    add(view, add(el('div', 'head'), el('div', 'title', 'Schedules'),
      el('div', 'st', 'Runs on ' + settings.runs_on + ' · ' + (settings.connectors.join(', ') || 'no connector set up'))));
    var sec = el('div', 'sec');
    settings.schedules.forEach(function (sch, i) {
      var cell = add(el('div', 'cell tap'), add(el('div', 'mid'), el('div', 't', sch.name),
        el('div', 'st', sch.at + '–' + sch.until + ' · ' + daysLabel(sch.days) + ' · ' + windowLabel(sch.window))), el('span', 'chev', '›'));
      cell.onclick = function () { go(function () { return editView(i); }); };
      sec.appendChild(cell);
    });
    var addCell = add(el('div', 'cell tap'), add(el('div', 'mid'), el('div', 't link', '+ Add schedule')));
    addCell.onclick = function () { go(function () { return editView(-1); }); };
    sec.appendChild(addCell);
    view.appendChild(sec);
    view.appendChild(el('div', 'note', 'A schedule sends once a day, between its start and end, to its connectors. The timer checks every 5 minutes.'));
    return view;
  }

  function editView(index) {
    var base = index >= 0 ? settings.schedules[index] : settings.defaults;
    var draft = JSON.parse(JSON.stringify(base));
    if (index < 0) draft.name = 'schedule' + (settings.schedules.length + 1);
    var view = el('div');
    add(view, add(el('div', 'head'), el('div', 'title', index >= 0 ? draft.name : 'New schedule')));
    var err = el('div', 'err');

    function input(label, type, value, set) {
      var i = el('input'); i.type = type; i.value = value;
      i.oninput = function () { set(i.value); };
      return add(el('div', 'field'), el('label', null, label), i);
    }
    var sec = el('div', 'sec');
    add(sec, input('Name', 'text', draft.name, function (v) { draft.name = v.trim(); }),
      input('Starts', 'time', draft.at, function (v) { draft.at = v; }),
      input('Ends', 'time', draft.until, function (v) { draft.until = v; }));
    var sel = el('select');
    WINDOWS.forEach(function (w) { var o = el('option', null, w[1]); o.value = w[0]; sel.appendChild(o); });
    var custom = el('option', null, 'Late + next N days…'); custom.value = 'n'; sel.appendChild(custom);
    sel.value = typeof draft.window === 'number' ? 'n' : draft.window;
    sel.onchange = function () {
      if (sel.value !== 'n') { draft.window = sel.value; return; }
      var n = parseInt(window.prompt('Days ahead', '3') || '', 10);
      if (n >= 0) draft.window = n; else sel.value = typeof draft.window === 'number' ? 'n' : draft.window;
    };
    sec.appendChild(add(el('div', 'field'), el('label', null, 'Lists'), sel));
    view.appendChild(sec);

    view.appendChild(el('div', 'sh', 'Days'));
    var days = el('div', 'sec days');
    DAYS.forEach(function (d) {
      var b = el('button', 'day' + (draft.days.indexOf(d) >= 0 ? ' on' : ''), d.charAt(0).toUpperCase() + d.slice(1));
      b.type = 'button';
      b.onclick = function () {
        var at = draft.days.indexOf(d);
        if (at >= 0) draft.days.splice(at, 1); else draft.days.push(d);
        draft.days.sort(function (a, c) { return DAYS.indexOf(a) - DAYS.indexOf(c); });
        b.classList.toggle('on', at < 0);
        if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
      };
      days.appendChild(b);
    });
    view.appendChild(days);

    view.appendChild(el('div', 'sh', 'Send to'));
    var to = el('div', 'sec');
    if (!settings.connectors.length) to.appendChild(add(el('div', 'field'), el('label', 'cap', 'No connector set up on ' + settings.runs_on)));
    settings.connectors.forEach(function (c) {
      var box = el('input'); box.type = 'checkbox';
      box.checked = !draft.to || !draft.to.length || draft.to.indexOf(c) >= 0;
      box.onchange = function () {
        var list = settings.connectors.filter(function (x) { return x === c ? box.checked : (!draft.to || !draft.to.length || draft.to.indexOf(x) >= 0); });
        draft.to = list.length === settings.connectors.length ? [] : list;
      };
      to.appendChild(add(el('div', 'field'), el('label', null, c), box));
    });
    view.appendChild(to);
    var where = el('div', 'sec');
    where.appendChild(add(el('div', 'field'), el('label', null, 'Runs on'), el('span', 'cap', settings.runs_on)));
    view.appendChild(where);
    view.appendChild(err);

    function save(list) {
      err.textContent = '';
      if (tg) tg.MainButton.showProgress(false);
      api('/tg/api/settings/save', { schedules: list }).then(function (r) {
        settings.schedules = r.schedules;
        if (tg) { tg.MainButton.hideProgress(); tg.HapticFeedback.notificationOccurred('success'); }
        back();
      }).catch(function (e) {
        if (tg) { tg.MainButton.hideProgress(); tg.HapticFeedback.notificationOccurred('error'); }
        err.textContent = e.message;
      });
    }
    function saveDraft() {
      var list = settings.schedules.slice();
      if (index >= 0) list[index] = draft; else list.push(draft);
      save(list);
    }
    if (index >= 0) {
      var del = add(el('div', 'sec'), add(el('div', 'cell tap'), add(el('div', 'mid'), el('div', 't danger', 'Delete schedule'))));
      del.onclick = function () {
        var remove = function (ok) { if (ok) save(settings.schedules.filter(function (_, i) { return i !== index; })); };
        if (tg && tg.showConfirm) tg.showConfirm('Delete ' + draft.name + '?', remove); else remove(window.confirm('Delete ' + draft.name + '?'));
      };
      view.appendChild(del);
    }
    if (!mainButton('Save', saveDraft)) {
      var b = el('button', 'fallback-save', 'Save'); b.type = 'button'; b.onclick = saveDraft; view.appendChild(b);
    }
    return view;
  }

  function fail(text) { root.textContent = ''; root.appendChild(el('div', 'msg error', text)); }

  fetch('/tg/api/due', { method: 'POST', headers: { 'X-Telegram-Init-Data': tg ? tg.initData : '' } })
    .then(function (res) {
      if (res.status === 401) throw new Error('Open this from the Trame bot in Telegram.');
      if (!res.ok) throw new Error('Trame is unreachable right now (' + res.status + ').');
      return res.json();
    })
    .then(function (body) {
      data.icons = body.icons || {};
      data.rows = (body.rows || []).map(function (r) {
        return { project: r.project || 'No project', card: r.card_title || r.page_title || 'Untitled',
                 status: r.status, text: r.text, days: r.days, due: r.due };
      }).sort(function (a, b) { return a.days - b.days; });
      show(home());
    })
    .catch(function (e) { fail(e.message); });
})();
</script>
</body>
</html>
