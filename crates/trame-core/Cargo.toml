[package]
name = "trame-core"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rust-core"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
regex = "1.13.1"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
wasm-bindgen = "0.2.130"

[lints]
workspace = true
