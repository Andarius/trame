[package]
name = "trame-hub"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.105"
axum = "0.8.9"
hyper = { version = "1.13.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio", "service"] }
postgres = "0.19.14"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2.0"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
trame-local = { path = "../trame-local", default-features = false }
trame-protocol = { path = "../trame-protocol" }

[lints]
workspace = true
