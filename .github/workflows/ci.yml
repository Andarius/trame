name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9"

      - name: Build frontend (generates embed.ts)
        run: cd app && deno task web:build

      - name: Typecheck
        run: cd app && deno check main.ts ../track/track.ts ../mcp/server.ts

      - name: Typecheck frontend (TS 7)
        run: cd app/web && npm run typecheck

      - name: Lint
        run: cd app && deno lint

      - name: Install Playwright Chromium
        run: cd app/web && npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: cd app/web && npx playwright test

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: app/web/test-results
          if-no-files-found: ignore
