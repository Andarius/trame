name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing git tag to publish, for example v0.14.0
        required: true
        type: string
      allow_native_cutover:
        description: Acknowledge native migration, rollback backup, and unqualified macOS support
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.value }}
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Resolve release tag
        id: tag
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          ALLOW_NATIVE_CUTOVER: ${{ inputs.allow_native_cutover }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${ALLOW_NATIVE_CUTOVER}" != true ]]; then
            echo "Native runtime cutover requires allow_native_cutover." >&2
            exit 1
          fi
          tag="${REQUESTED_TAG#refs/tags/}"
          [[ "${tag}" == v* ]] || tag="v${tag}"
          git fetch --tags --force
          commit="$(git rev-parse "${tag}^{commit}")"
          echo "commit=${commit}" >> "${GITHUB_OUTPUT}"
          echo "value=${tag}" >> "${GITHUB_OUTPUT}"
      - name: Verify version and create draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.tag.outputs.value }}
        run: |
          git checkout --detach "${{ steps.tag.outputs.commit }}"
          version="$(sed -n 's/.*"version":[[:space:]]*"\([^"]*\)".*/\1/p' package.json | head -n1)"
          test "${RELEASE_TAG}" = "v${version}"
          test "${version}" = "$(sed -n 's/.*"version":[[:space:]]*"\([^"]*\)".*/\1/p' crates/trame-desktop/tauri.conf.json | head -n1)"
          gh release view "${RELEASE_TAG}" --repo "${GH_REPO}" >/dev/null 2>&1 || gh release create "${RELEASE_TAG}" --repo "${GH_REPO}" --draft --generate-notes --title "${RELEASE_TAG}"

  verify:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      commit: ${{ needs.prepare.outputs.commit }}
    permissions:
      contents: read

  # builds run alongside verify: assets land on the draft, and only publish waits for verify
  build:
    needs: prepare
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22.23.5"
      - name: Install Rust and native build libraries
        run: |
          rustup toolchain install  # reads rust-toolchain.toml
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            libicu74 liburing2 libnuma1 libxml2 libldap2 libpam0g libzstd1 liblz4-1 libpq5
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build deb
        run: bash scripts/rust-package.sh deb
      - name: Build snap
        # the snap only unpacks the deb: pack it on the runner (core24 = ubuntu-24.04) instead of in an LXD VM
        run: |
          sudo snap install snapcraft --classic
          sudo snapcraft pack --destructive-mode
      - name: Build AppImage (best effort)
        continue-on-error: true
        run: TRAME_BUNDLE_ONLY=1 bash scripts/rust-package.sh appimage
      - name: Upload native assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp dist/linux/trame.deb "trame-${RELEASE_TAG}-linux-x64.deb"
          cp target/release/tramecli "tramecli-${RELEASE_TAG}-linux-x64"
          gh release upload "${RELEASE_TAG}" "trame-${RELEASE_TAG}-linux-x64.deb" "tramecli-${RELEASE_TAG}-linux-x64" \
            trame_*_amd64.snap --repo "${GH_REPO}" --clobber
          if [[ -f dist/linux/Trame.AppImage ]]; then
            cp dist/linux/Trame.AppImage "Trame-${RELEASE_TAG}-native-x64.AppImage"
            gh release upload "${RELEASE_TAG}" "Trame-${RELEASE_TAG}-native-x64.AppImage" --repo "${GH_REPO}" --clobber
          fi

  build-macos:
    needs: prepare
    runs-on: macos-15
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22.23.5"
      - name: Rust toolchain
        run: rustup toolchain install  # reads rust-toolchain.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build dmg (ad-hoc signed)
        run: bash scripts/rust-package.sh dmg
      - name: Upload macOS assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp dist/macos/Trame.dmg "Trame-${RELEASE_TAG}-native-arm64.dmg"
          cp dist/macos/tramecli "tramecli-${RELEASE_TAG}-macos-arm64"
          gh release upload "${RELEASE_TAG}" "Trame-${RELEASE_TAG}-native-arm64.dmg" "tramecli-${RELEASE_TAG}-macos-arm64" --repo "${GH_REPO}" --clobber

  publish:
    needs: [prepare, verify, build, build-macos]
    runs-on: ubuntu-24.04
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "${RELEASE_TAG}" --repo "${GH_REPO}" --draft=false
