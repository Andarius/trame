name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing git tag to publish, for example v0.14.0
        required: true
        type: string
      allow_native_cutover:
        description: Acknowledge native migration, rollback backup, and unqualified macOS support
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.value }}
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Resolve release tag
        id: tag
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          ALLOW_NATIVE_CUTOVER: ${{ inputs.allow_native_cutover }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" != workflow_dispatch || "${ALLOW_NATIVE_CUTOVER}" != true ]]; then
            echo "Native runtime cutover requires a manual release with allow_native_cutover; tag pushes cannot publish it." >&2
            exit 1
          fi
          if [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch ]]; then
            tag="${REQUESTED_TAG#refs/tags/}"
            [[ "${tag}" == v* ]] || tag="v${tag}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          git fetch --tags --force
          commit="$(git rev-parse "${tag}^{commit}")"
          echo "commit=${commit}" >> "${GITHUB_OUTPUT}"
          echo "value=${tag}" >> "${GITHUB_OUTPUT}"
      - name: Verify version and create draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.tag.outputs.value }}
        run: |
          git checkout --detach "${{ steps.tag.outputs.commit }}"
          version="$(sed -n 's/.*"version":[[:space:]]*"\([^"]*\)".*/\1/p' app/deno.json | head -n1)"
          test "${RELEASE_TAG}" = "v${version}"
          test "${version}" = "$(sed -n 's/.*"version":[[:space:]]*"\([^"]*\)".*/\1/p' crates/trame-desktop/tauri.conf.json | head -n1)"
          gh release view "${RELEASE_TAG}" --repo "${GH_REPO}" >/dev/null 2>&1 || gh release create "${RELEASE_TAG}" --repo "${GH_REPO}" --draft --generate-notes --title "${RELEASE_TAG}"

  verify:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      commit: ${{ needs.prepare.outputs.commit }}
    permissions:
      contents: read

  build:
    needs: [prepare, verify]
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9"
      - name: Install Rust and native build libraries
        run: |
          rustup toolchain install  # reads rust-toolchain.toml
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            libicu74 liburing2 libnuma1 libxml2 libldap2 libpam0g libzstd1 liblz4-1 libpq5
      - name: Build deb
        run: bash scripts/rust-package.sh deb
      - name: Build AppImage (best effort)
        continue-on-error: true
        run: bash scripts/rust-package.sh appimage
      - name: Upload native assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp dist/linux/trame.deb "trame-${RELEASE_TAG}-linux-x64.deb"
          cp target/release/tramecli "tramecli-${RELEASE_TAG}-linux-x64"
          gh release upload "${RELEASE_TAG}" "trame-${RELEASE_TAG}-linux-x64.deb" "tramecli-${RELEASE_TAG}-linux-x64" --repo "${GH_REPO}" --clobber
          if [[ -f dist/linux/Trame.AppImage ]]; then
            cp dist/linux/Trame.AppImage "Trame-${RELEASE_TAG}-native-x64.AppImage"
            gh release upload "${RELEASE_TAG}" "Trame-${RELEASE_TAG}-native-x64.AppImage" --repo "${GH_REPO}" --clobber
          fi

  build-macos:
    needs: [prepare, verify]
    runs-on: macos-14
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9"
      - name: Build dmg (ad-hoc signed)
        run: |
          rustup toolchain install  # reads rust-toolchain.toml
          bash scripts/rust-package.sh dmg
      - name: Upload macOS assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp dist/macos/Trame.dmg "Trame-${RELEASE_TAG}-native-arm64.dmg"
          cp dist/macos/tramecli "tramecli-${RELEASE_TAG}-macos-arm64"
          gh release upload "${RELEASE_TAG}" "Trame-${RELEASE_TAG}-native-arm64.dmg" "tramecli-${RELEASE_TAG}-macos-arm64" --repo "${GH_REPO}" --clobber

  snap:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - name: Download deb
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p dist/linux
          gh release download "${RELEASE_TAG}" --repo "${GH_REPO}" --pattern "trame-${RELEASE_TAG}-linux-x64.deb" --dir dist/linux
          mv "dist/linux/trame-${RELEASE_TAG}-linux-x64.deb" dist/linux/trame.deb
      - name: Build snap
        uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1.3.0
        id: snapcraft
      - name: Upload snap
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${RELEASE_TAG}" "${{ steps.snapcraft.outputs.snap }}" --repo "${GH_REPO}" --clobber

  publish:
    needs: [prepare, verify, build, build-macos, snap]
    runs-on: ubuntu-24.04
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "${RELEASE_TAG}" --repo "${GH_REPO}" --draft=false
