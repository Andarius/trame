name: Compose

# Builds Trame with the native plugins listed in the calling repo and publishes the result as that
# repo's release; the build updates itself from those releases. Usage: docs-site/src/content/docs/plugins.md
on:
  workflow_call:
    inputs:
      plugins:
        description: Plugin list in the calling repo ({"plugins":["owner/repo","owner/repo@tag"]})
        type: string
        default: plugins.json
      trame:
        description: Trame tag to build (default its latest release)
        type: string
        default: ""
      macos:
        description: Also build the macOS dmg
        type: boolean
        default: true
      force:
        description: Rebuild even if nothing changed since the last release
        type: boolean
        default: false
    secrets:
      plugins-token:
        description: Token that can read private plugin repos (default the caller's GITHUB_TOKEN)
        required: false

# plugin code runs in the build jobs: they get a read-only token, only publish can write
permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ secrets.plugins-token || github.token }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      trame: ${{ steps.trame.outputs.tag }}
      tag: ${{ steps.release.outputs.tag }}
      skip: ${{ steps.release.outputs.skip }}
    steps:
      - name: Resolve Trame release
        id: trame
        env:
          GH_TOKEN: ${{ github.token }}
          WANT: ${{ inputs.trame }}
        run: |
          tag="${WANT:-$(gh api repos/Andarius/trame/releases/latest -q .tag_name)}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a Trame release tag: $tag" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Andarius/trame
          ref: ${{ steps.trame.outputs.tag }}
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: .scratch/caller
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"
      - name: Resolve plugins
        env:
          PLUGINS: .scratch/caller/${{ inputs.plugins }}
        run: |
          gh auth setup-git
          bun scripts/compose-plugins.ts "$PLUGINS" --lock lock.json
          # the build jobs compose exactly these tags; they check the commits against lock.json
          bun -e 'const l = await Bun.file("lock.json").json(); console.log(JSON.stringify({ plugins: l.plugins.map((p) => `${p.repo}@${p.tag}`) }))' > pinned.json
      - name: Skip or name the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FORCE: ${{ inputs.force }}
          TRAME_TAG: ${{ steps.trame.outputs.tag }}
        run: |
          sum="$(sha256sum lock.json | cut -c1-64)"
          releases="$(gh api "repos/$GH_REPO/releases" --paginate)"
          if [[ "$FORCE" != true ]] && jq -e --arg m "trame-compose: $sum" 'any(.[]; (.draft | not) and ((.body // "") | contains($m)))' <<<"$releases" >/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "a release already has this exact build"
            exit 0
          fi
          # drafts count too, so a failed run never reuses its number
          n="$(jq -r --arg p "$TRAME_TAG-" '.[].tag_name | select(startswith($p)) | ltrimstr($p) | select(test("^[0-9]+$"))' <<<"$releases" | sort -n | tail -1)"
          echo "tag=$TRAME_TAG-$(( ${n:-0} + 1 ))" >> "$GITHUB_OUTPUT"
          {
            echo "Trame $TRAME_TAG with:"
            jq -r '.plugins[] | "- [\(.repo)@\(.tag)](https://github.com/\(.repo)/tree/\(.commit))"' lock.json
            echo
            echo "<!-- trame-compose: $sum -->"
          } > notes.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.release.outputs.skip != 'true'
        with:
          name: compose
          path: |
            lock.json
            pinned.json
            notes.md

  linux:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Andarius/trame
          ref: ${{ needs.prepare.outputs.trame }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: compose
          path: .scratch/compose
      - uses: ./.github/actions/native-setup
      - name: Compose
        run: |
          gh auth setup-git
          bun scripts/compose-plugins.ts .scratch/compose/pinned.json --lock .scratch/built.json
          cmp .scratch/compose/lock.json .scratch/built.json
      - name: Build
        env:
          # baked in: updates come from this repo's releases
          TRAME_UPDATE_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ""
        run: |
          export TRAME_DISTRO_VERSION="${TAG#v}"
          bash scripts/rust-package.sh deb
          bash scripts/rust-package.sh appimage
          mkdir out
          cp dist/linux/trame.deb "out/trame-$TAG-linux-x64.deb"
          cp dist/linux/Trame.AppImage "out/Trame-$TAG-native-x64.AppImage"
          cp target/release/tramecli "out/tramecli-$TAG-linux-x64"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux
          path: out/

  macos:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true' && inputs.macos
    runs-on: macos-14
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Andarius/trame
          ref: ${{ needs.prepare.outputs.trame }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: compose
          path: .scratch/compose
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"
      - name: Compose
        run: |
          gh auth setup-git
          bun install --frozen-lockfile
          bun scripts/compose-plugins.ts .scratch/compose/pinned.json --lock .scratch/built.json
          cmp .scratch/compose/lock.json .scratch/built.json
      - name: Build
        env:
          TRAME_UPDATE_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ""
        run: |
          export TRAME_DISTRO_VERSION="${TAG#v}"
          rustup toolchain install  # reads rust-toolchain.toml
          bash scripts/rust-package.sh dmg
          mkdir out
          cp dist/macos/Trame.dmg "out/Trame-$TAG-native-arm64.dmg"
          cp dist/macos/tramecli "out/tramecli-$TAG-macos-arm64"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos
          path: out/

  publish:
    needs: [prepare, linux, macos]
    if: ${{ !cancelled() && needs.prepare.outputs.skip != 'true' && needs.linux.result == 'success' && needs.macos.result != 'failure' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release create "$TAG" --title "$TAG" --notes-file assets/compose/notes.md --latest \
            assets/linux/* $(ls assets/macos/* 2>/dev/null)
