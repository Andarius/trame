name: TMP snap pack test
on: pull_request
jobs:
  snap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch a released deb
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/linux
          gh release download v0.35.3 --repo "${{ github.repository }}" --pattern 'trame-v0.35.3-linux-x64.deb' --dir dist/linux
          mv dist/linux/trame-v0.35.3-linux-x64.deb dist/linux/trame.deb
      - name: Build snap
        run: |
          time sudo snap install snapcraft --classic
          time sudo snapcraft pack --destructive-mode
          ls -la trame_*_amd64.snap
          unsquashfs -l trame_*_amd64.snap | grep -E "usr/bin/(trame|tramecli)$|meta/snap.yaml"
