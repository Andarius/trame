name: Native setup
description: Node, Bun, Rust (cached), native libraries and PostgreSQL 18 resources

runs:
  using: composite
  steps:
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: "22.23.4"
        cache: npm
        cache-dependency-path: app/web/package-lock.json

    - name: Install frontend deps (pinned, from lockfile)
      shell: bash
      run: cd app/web && npm ci

    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: "1.4.4"

    - name: Install app TypeScript deps (from lockfile)
      shell: bash
      run: bun install --frozen-lockfile

    - name: Install Rust and native build libraries
      shell: bash
      run: |
        rustup toolchain install  # reads rust-toolchain.toml
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
          libicu74 liburing2 libnuma1 libxml2 libldap2 libpam0g libzstd1 liblz4-1 libpq5

    # PR runs restore master's cache but never save their own (10 GB repo quota)
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        save-if: ${{ github.ref == 'refs/heads/master' }}

    - name: Prepare PostgreSQL 18 resources
      shell: bash
      run: bash scripts/rust-package.sh prepare
