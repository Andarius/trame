name: trame
adopt-info: trame
summary: Local-first session tracker for Claude Code work
description: |
  Trame tracks parallel coding sessions as a kanban board and keeps local data
  in a supervised PostgreSQL 18 cluster.
license: MIT
grade: stable
confinement: classic
base: core24
platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]

apps:
  trame:
    command: usr/bin/trame
    desktop: usr/share/applications/trame.desktop
  tramecli:
    command: usr/bin/tramecli

parts:
  trame:
    plugin: nil
    build-packages: [dpkg]
    override-pull: |
      craftctl default
      version="$(sed -n 's/.*"version":[[:space:]]*"\([^"]*\)".*/\1/p' "${CRAFT_PROJECT_DIR}/app/deno.json" | head -n1)"
      craftctl set version="${version}"
    override-build: |
      craftctl default
      dpkg-deb -x "${CRAFT_PROJECT_DIR}/dist/linux/trame.deb" "${CRAFT_PART_INSTALL}"
    stage-packages:
      - libwebkit2gtk-4.1-0
      - libgtk-3-0t64
      - libicu74
      - liburing2
      - libnuma1
      - libxml2
      - libldap2
      - libpam0g
      - libssl3t64
      - libzstd1
      - liblz4-1
      - libpq5
